spring.application.name=backend
app.base-url=http://localhost:8080
spring.config.import=optional:classpath:application-secrets.properties

# ===============================
# CONEXIÓN A LA BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/taiko_db
spring.datasource.username=taiko_admin
spring.datasource.password=taiko_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===============================
# Usamos 'none' o 'validate' porque ya hemos creado nuestras tablas manualmente con un script SQL.
# Si pusiéramos 'update', Hibernate podría intentar modificar nuestras tablas y romper los campos vector o UUID.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostrar las consultas SQL en la consola (muy útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# El backend correrá en el puerto 8080
server.port=8080


# ===============================
# CONFIGURACIÓN DE OPENAI
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}

# Modelo para generar embeddings (text-embedding-3-small es muy barato y eficiente)
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ===============================
# TELEGRAM BOT
# ===============================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# ===============================
# JWT (JSON Web Token)
# ===============================
# Secreto base64 para firmar los tokens (en prod, usar variable de entorno)
jwt.secret=QzRCQjc2MzBGNURDNTVFRUVGMDBBMUY5RTI0QThFODJCOTREQTg0QUEzMUZDMzdDNTA3OUE0QTNGMTNCMERGOQ==
# Tiempo de expiración del token (24 horas)
jwt.expiration-ms=86400000
